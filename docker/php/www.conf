; Ultimate POS — php-fpm pool.
; Filename sorts after the image's zz-docker.conf, so these values win.

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

pm = dynamic
; Rough sizing: max_children x memory_limit is the worst-case RSS. 20 x 512M is
; comfortable on a 4 GB box; raise it with the host, not beyond it.
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recycle workers to bound leaks in long-lived PDF/Excel work.
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /fpm-ping

; Slightly above php.ini's max_execution_time so PHP reports the timeout first.
request_terminate_timeout = 130s
request_slowlog_timeout = 30s
slowlog = /proc/self/fd/2

; Worker stdout/stderr becomes container log output.
catch_workers_output = yes
decorate_workers_output = no

; Keep the container's environment visible to PHP (the app reads .env, but
; anything injected by compose should still reach getenv()).
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
