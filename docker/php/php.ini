; Ultimate POS — production PHP settings.
; Loaded from /usr/local/etc/php/conf.d/ so it overrides the image defaults.

[PHP]
expose_php = Off

; Excel imports, PDF/mPDF rendering and large product catalogues need headroom.
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; A POS sale or a stock adjustment can post a few hundred line items, each with
; several fields. The PHP default of 1000 silently truncates those forms.
max_input_vars = 10000

; Keep in sync with client_max_body_size in docker/nginx/nginx.conf.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

date.timezone = UTC

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; Uploaded files must never be treated as includable code.
allow_url_fopen = On
allow_url_include = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Session]
session.cookie_httponly = On
session.use_strict_mode = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; The app plus its 20+ modules is a large file count — leave room.
opcache.max_accelerated_files = 30000
; Code never changes inside a running container, so skip the stat() per include.
; Deploys replace the container, which starts with a cold cache.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
; Doctrine annotations and PHP attributes read docblocks at runtime.
opcache.save_comments = 1
