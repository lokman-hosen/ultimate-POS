# Ultimate POS — this mirrors the rules the app ships in public/.htaccess,
# plus the hardening you want on a public server.

# Trust X-Forwarded-* only from private ranges (a host reverse proxy, a load
# balancer). Public clients cannot spoof their address through this.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# PHP treats any non-empty, non-"off" HTTPS value as a secure request, so map
# the forwarded scheme rather than passing it through verbatim.
map $http_x_forwarded_proto $fcgi_https {
    default "";
    https   "on";
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php index.html;

    # Docker's embedded DNS. Without this, nginx resolves the "app" hostname
    # once at startup and caches that IP for the life of the worker — so
    # recreating the app container (a rebuild, a `compose up` after an image
    # change) strands nginx on a dead address and every request 502s until web
    # is restarted too. Paired with the variable in fastcgi_pass below, the
    # name is re-resolved every 10s instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Container healthcheck / load-balancer probe — answered by nginx alone, so
    # it stays green while PHP is restarting.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Dotfiles (.env, .git, .htaccess) are never served.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # public/uploads holds user-supplied files, and BACKUP_DISK=local writes
    # database dumps there too. Nothing in it may be executed or downloaded as
    # an archive. This block is first, so it wins over the static-asset rule.
    location ~* ^/uploads/.*\.(php[0-9]?|phtml|phps|pl|py|jsp|asp|aspx|cgi|sh|bash|exe|so|htaccess|htpasswd|ini|log|sql|zip|gz|tar|bak)$ {
        deny all;
    }

    # The bundled web installer disables itself once .env exists (which it
    # always does here), but there is no reason to expose it at all.
    location ^~ /install {
        deny all;
    }

    # Equivalent of `php artisan storage:link`, without depending on a symlink
    # existing inside the nginx image.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp3|wav|ogg|mp4|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is ever executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $fcgi_https if_not_empty;

        # Via a variable on purpose: it defers name resolution to request time
        # (see the resolver above). A literal `fastcgi_pass app:9000` is
        # resolved once, at startup, and never again.
        set $upstream_app app:9000;
        fastcgi_pass  $upstream_app;
        fastcgi_index index.php;

        fastcgi_hide_header X-Powered-By;
        # Above php-fpm's request_terminate_timeout so PHP's own error wins.
        fastcgi_read_timeout 140s;
        fastcgi_buffer_size  32k;
        fastcgi_buffers      16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    # Any other .php file (vendor scripts, stray uploads) is not reachable.
    location ~ \.php$ {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# TLS
#
# Terminate HTTPS at a reverse proxy in front of this stack (Caddy, Traefik,
# nginx + certbot on the host, or a cloud load balancer) and forward to
# web:80 with X-Forwarded-Proto set — see DOCKER.md.
#
# To terminate here instead: publish 443 in docker-compose.yml, mount your
# certificates into /etc/nginx/ssl, and uncomment the server block below.
# ---------------------------------------------------------------------------
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name pos.example.com;
#
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     root /var/www/html/public;
#     # ... duplicate the location blocks from the server above ...
# }
