# Ultimate POS — production stack.
#
#   web        nginx, the public entrypoint
#   app        php-fpm running the application
#   queue      php artisan queue:work
#   scheduler  php artisan schedule:work (cron replacement)
#   db         MySQL 8.0, its own container, data in the db-data volume
#   redis      cache / session / queue backend
#   adminer    database browser, published on localhost only
#
# Configuration comes from the Laravel .env file in this directory: the app
# containers bind-mount it, and compose reads the same file for the values it
# needs here. Start from .env.docker.example — see DOCKER.md.

name: ultimate-pos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  image: ultimate-pos-app:latest
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # The application's configuration and secrets.
    #
    # Read-write, not :ro — the superadmin settings screen saves mail, payment
    # gateway and backup settings by rewriting this file in place. The
    # entrypoint gives www-data write access to it. Add :ro back if you would
    # rather manage .env only from the host; the settings screen will then
    # report that it could not save.
    - ./.env:/var/www/html/.env
    # Everything the app writes. Both are named volumes, so they outlive
    # container restarts, recreates and image rebuilds.
    - uploads:/var/www/html/public/uploads
    - storage:/var/www/html/storage
  networks:
    - internal
    - edge

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-ultimatepos}
      # Must not be "root" — the MySQL image refuses to create that user.
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/ultimate-pos.cnf:ro
      # The dumps shipped with the app, for the initial import (read-only).
      - ./database/backup:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # Not published: only the app containers reach the database, over the
    # internal network. To connect a client, tunnel in or use
    # `docker compose exec db mysql ...`.
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal

  app:
    <<: *app-image
    environment:
      CONTAINER_ROLE: app
      # Leave false and run migrations deliberately on a live database:
      #   docker compose exec app php artisan migrate --force
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}

  queue:
    <<: *app-image
    environment:
      CONTAINER_ROLE: queue
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
      # Recycle the worker hourly so it picks up new code and releases memory.
      - --max-time=3600
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *app-image
    environment:
      CONTAINER_ROLE: scheduler
    # Replaces the `* * * * * php artisan schedule:run` crontab entry.
    # NOTE: app/Console/Kernel.php only registers the backup and recurring
    # invoice jobs when APP_ENV=live, so set that in .env.
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  adminer:
    image: adminer:5
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Prefills the "Server" field on the login form. Log in with
      # DB_USERNAME / DB_PASSWORD (or root / DB_ROOT_PASSWORD).
      ADMINER_DEFAULT_SERVER: db
    ports:
      # Bound to 127.0.0.1 by default — a database console has no business
      # being open to the internet. On a remote host, tunnel to it:
      #   ssh -N -L 8081:127.0.0.1:8081 you@server
      # then open http://localhost:8081. Setting ADMINER_BIND=0.0.0.0 exposes
      # it publicly; only do that behind a VPN or an authenticating proxy.
      - "${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      # edge so the published port is reachable, internal to reach db.
      - edge
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ultimate-pos-web:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_started
    ports:
      # Bind to 127.0.0.1 when a TLS reverse proxy on the host fronts this,
      # e.g. HTTP_BIND=127.0.0.1 in .env.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      # Uncomment together with the TLS server block in docker/nginx/default.conf:
      # - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      # nginx serves uploaded files and public storage straight from disk;
      # read-only, since only PHP ever writes them.
      - uploads:/var/www/html/public/uploads:ro
      - storage:/var/www/html/storage:ro
      # - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - edge
      - internal

volumes:
  # Uploaded images, documents and the local-disk backups. Survives
  # restart / stop / down / image rebuild; only `docker compose down -v`
  # or an explicit `docker volume rm` destroys it.
  uploads:
  # Laravel storage: logs, compiled views, Passport keys, mPDF temp files.
  storage:
  db-data:
  redis-data:

networks:
  # Reaches the host network: published ports, and the outbound calls the app
  # makes (SMTP, payment gateways, Twilio, Pusher, off-site backups).
  edge:
  # No route off the host. The database and Redis sit here only, so nothing
  # can reach them except the application containers.
  internal:
    internal: true
